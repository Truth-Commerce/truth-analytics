<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Truth Analytics — Design da Plataforma</title>
<style>
  @page { size: A4; margin: 18mm 16mm; }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", -apple-system, sans-serif;
    font-size: 10.5pt; line-height: 1.55; color: #1a202c;
    max-width: 100%; margin: 0;
  }
  h1 {
    font-size: 20pt; color: #1a365d; line-height: 1.25;
    border-bottom: 3px solid #2b6cb0; padding-bottom: 10px; margin: 0 0 14px;
  }
  h2 {
    font-size: 14pt; color: #2b6cb0; margin: 26px 0 10px;
    border-bottom: 1px solid #cbd5e0; padding-bottom: 4px;
    page-break-after: avoid;
  }
  h3 { font-size: 11.5pt; color: #2c5282; margin: 16px 0 6px; page-break-after: avoid; }
  p { margin: 6px 0; }
  ul, ol { margin: 6px 0; padding-left: 22px; }
  li { margin: 3px 0; }
  strong { color: #1a365d; }
  code {
    font-family: Consolas, monospace; font-size: 9pt;
    background: #edf2f7; border-radius: 3px; padding: 1px 4px; color: #2d3748;
  }
  table {
    border-collapse: collapse; width: 100%; margin: 10px 0;
    font-size: 9pt; page-break-inside: avoid;
  }
  th {
    background: #2b6cb0; color: #fff; text-align: left;
    padding: 6px 8px; font-size: 9pt;
  }
  td { border: 1px solid #cbd5e0; padding: 5px 8px; vertical-align: top; }
  tr:nth-child(even) td { background: #f7fafc; }
  blockquote { border-left: 3px solid #2b6cb0; margin: 8px 0; padding: 2px 12px; color: #4a5568; }
  /* quebras de página antes das seções principais mais pesadas */
  h2:nth-of-type(3), h2:nth-of-type(5), h2:nth-of-type(8) { page-break-before: always; }
</style>
</head>
<body>
