name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # postgres:16-alpine — Docker Official Images registry digest
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: truth
          POSTGRES_PASSWORD: truth
          POSTGRES_DB: truth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truth -d truth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgresql://truth:truth@127.0.0.1:5432/truth_test
      POSTGRES_URL_DIRECT: postgresql://truth:truth@127.0.0.1:5432/truth_test
      DATABASE_URL_TEST: postgresql://truth:truth@127.0.0.1:5432/truth_test
      DATABASE_URL_TEST_DIRECT: postgresql://truth:truth@127.0.0.1:5432/truth_test
      AUTH_SECRET: truth-analytics-ci-auth-secret
      APP_URL: http://localhost:3100
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate:test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
