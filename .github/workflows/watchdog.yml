# O plano Hobby da Vercel limita crons a 1x/dia, então o watchdog roda aqui.
# A cada 30 min (mínimo de 1 min faturado por job → */10 estouraria os
# 2000 min/mês grátis da org). Detecção de relatório travado em até ~30 min.
name: Watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chamar rota do watchdog
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://truth-analytics.vercel.app/api/cron/watchdog"
